<app-header 
  modo="painel" 
  [exibirNotificacao]="true" 
  [exibirConfiguracao]="true">
</app-header>

<app-container-content espacamentoPersonalizado="px-3 py-5 sm:px-5 sm:py-6">
  <div class="flex flex-col w-full">

    <!-- Card Principal: Boas-vindas e Disponibilidade (RF13) -->
    <div class="bg-white rounded-3xl shadow-xs border border-slate-100 p-4 sm:p-5 w-full mb-6 sm:mb-7">
      
      <div class="flex items-center gap-4">
        <img 
          [src]="fotoInstrutorUrl" 
          [alt]="nomeInstrutor"
          class="w-16 h-16 rounded-full object-cover border border-slate-200 shrink-0" />

        <div class="flex flex-col">
          <span class="text-xs text-slate-500 font-medium">
            Bem-vindo de volta,
          </span>
          <h1 class="text-xl font-bold text-[#153969] mt-0.5 flex items-center gap-1.5">
            <span>Olá, {{ nomeInstrutor }}</span>
            <span>👋</span>
          </h1>
          <div class="flex items-center gap-1.5 mt-1">
            <img src="assets/icons/star_fill_icon.svg" alt="Avaliação" class="w-4 h-4" />
            <span class="text-xs font-medium text-slate-500">
              {{ avaliacaoMedia }} · {{ totalAvaliacoes }} avaliações
            </span>
          </div>
        </div>
      </div>

      <!-- Divisor Horizontal -->
      <div class="border-t border-slate-100 my-4"></div>

      <!-- Controle de Visibilidade da Oferta -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span 
            class="w-2.5 h-2.5 rounded-full transition-colors"
            [ngClass]="disponivelParaNovosAlunos ? 'bg-[#159947]' : 'bg-slate-300'">
          </span>
          <span class="text-sm font-bold text-[#153969]">
            Disponível para novos alunos
          </span>
        </div>

        <button
          type="button"
          role="switch"
          [attr.aria-checked]="disponivelParaNovosAlunos"
          (click)="alternarDisponibilidade()"
          class="w-12 h-7 rounded-full p-1 transition-colors duration-200 ease-in-out flex items-center cursor-pointer"
          [ngClass]="disponivelParaNovosAlunos ? 'bg-[#3B82F6] justify-end' : 'bg-slate-300 justify-start'">
          <span class="w-5 h-5 bg-white rounded-full shadow-xs transition-transform"></span>
        </button>
      </div>

    </div>

    <!-- Seção: Ações Rápidas -->
    <span class="text-xs font-semibold text-[#153969] uppercase tracking-wider mb-3.5">
      Ações Rápidas
    </span>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-3.5">
      
      <!-- Card 1: Editar Perfil (RF04) -->
      <button
        type="button"
        (click)="abrirEditarPerfil()"
        class="bg-white hover:bg-slate-50/80 rounded-3xl shadow-xs border border-slate-100 p-5 text-left flex flex-col justify-between transition cursor-pointer">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-4">
          <img src="assets/icons/edit_icon.svg" alt="Editar Perfil" class="w-5 h-5" />
        </div>

        <div>
          <h2 class="text-[15px] font-bold text-[#153969] mb-1">
            Editar Perfil
          </h2>
          <p class="text-xs text-slate-500 leading-relaxed">
            Atualize suas informações pessoais
          </p>
        </div>
      </button>

      <!-- Card 2: Gerenciar Serviços (RF11, RF12, RF13) -->
      <button
        type="button"
        (click)="abrirGerenciarServicos()"
        class="bg-white hover:bg-slate-50/80 rounded-3xl shadow-xs border border-slate-100 p-5 text-left flex flex-col justify-between transition cursor-pointer">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-4">
          <img src="assets/icons/manage_icon.svg" alt="Gerenciar Serviços" class="w-5 h-5" />
        </div>

        <div>
          <h2 class="text-[15px] font-bold text-[#153969] mb-1">
            Gerenciar Serviços
          </h2>
          <p class="text-xs text-slate-500 leading-relaxed">
            Categorias, valores e horários
          </p>
        </div>
      </button>

    </div>

  </div>
</app-container-content>

<app-bottom-nav 
  abaAtiva="inicio" 
  rotaInicio="/home-instrutor" 
  rotaBuscar="/home-instrutor" 
  rotaPerfil="/meu-perfil">
</app-bottom-nav>
