<app-header 
  modo="voltar" 
  titulo="Meu Perfil" 
  [rotaVoltar]="obterRotaVoltar()">
</app-header>

<app-container-content espacamentoPersonalizado="px-3 py-5 sm:px-5 sm:py-6">
  <div class="flex flex-col items-center w-full pb-5 sm:pb-6">

    <!-- Seção Superior: Foto de Perfil com Botão de Câmera -->
    <label for="input-foto-perfil" class="flex flex-col items-center cursor-pointer group mb-6">
      <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full p-1 bg-white shadow-sm border border-slate-100">
        <img 
          [src]="fotoPerfilUrl" 
          alt="Foto de perfil" 
          class="w-full h-full rounded-full object-cover" />

        <!-- Badge Azul com Ícone de Câmera -->
        <div class="absolute bottom-0 right-0 w-9 h-9 rounded-full bg-[#153969] border-2 border-white flex items-center justify-center shadow-xs group-hover:bg-[#0f2a4d] transition">
          <img src="assets/icons/photo_icon.svg" alt="Alterar foto" class="w-4 h-4 brightness-0 invert" />
        </div>
      </div>

      <span class="text-xs font-semibold text-[#153969] mt-3 group-hover:underline">
        Toque para alterar a foto
      </span>

      <input 
        id="input-foto-perfil" 
        type="file" 
        accept="image/*" 
        (change)="selecionarNovaFoto($event)" 
        class="hidden" />
    </label>

    <!-- Card do Formulário Cadastral (RF04) -->
    <div class="bg-white rounded-2xl shadow-xs border border-slate-100 p-4 sm:p-5 w-full mb-5 sm:mb-6">
      <form [formGroup]="formularioPerfil" (ngSubmit)="atualizarDados()" class="flex flex-col gap-4">
        
        <!-- Nome Completo -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Nome Completo
          </label>
          <div class="relative flex items-center">
            <img 
              src="assets/icons/name_icon_register.svg" 
              alt="Nome" 
              class="absolute left-3.5 w-4 h-4 opacity-70 pointer-events-none" />
            <input 
              type="text"
              formControlName="nomeCompleto"
              placeholder="Seu nome completo"
              class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-[#153969] outline-none focus:border-[#153969] transition" />
          </div>
        </div>

        <!-- E-mail -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            E-mail
          </label>
          <div class="relative flex items-center">
            <img 
              src="assets/icons/email_icon.svg" 
              alt="E-mail" 
              class="absolute left-3.5 w-4 h-4 opacity-70 pointer-events-none" />
            <input 
              type="email"
              formControlName="email"
              placeholder="seu@email.com"
              class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-[#153969] outline-none focus:border-[#153969] transition" />
          </div>
        </div>

        <!-- Telefone -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Telefone
          </label>
          <div class="relative flex items-center">
            <img 
              src="assets/icons/phone_icon_register.svg" 
              alt="Telefone" 
              class="absolute left-3.5 w-4 h-4 opacity-70 pointer-events-none" />
            <input 
              type="tel"
              inputmode="numeric"
              formControlName="telefone"
              (input)="formatarTelefone($event)"
              placeholder="(27) 9 0000-0000"
              class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-[#153969] outline-none focus:border-[#153969] transition" />
          </div>
        </div>

        <!-- Biografia -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Biografia
          </label>
          <div class="relative flex items-start">
            <img 
              src="assets/icons/document_icon.svg" 
              alt="Biografia" 
              class="absolute left-3.5 top-3.5 w-4 h-4 opacity-70 pointer-events-none" />
            <textarea 
              rows="3"
              formControlName="biografia"
              [placeholder]="obterPlaceholderBiografia()"
              class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-[#153969] placeholder:text-slate-400 outline-none focus:border-[#153969] transition resize-none leading-relaxed">
            </textarea>
          </div>
        </div>

        <!-- Divisor -->
        <div class="border-t border-slate-100 my-1"></div>

        <!-- Botão Alterar Senha -->
        <button
          type="button"
          (click)="alternarSecaoAlterarSenha()"
          class="flex items-center gap-2.5 text-[#153969] font-bold text-xs py-1 hover:opacity-80 transition w-fit cursor-pointer">
          <img src="assets/icons/password_icon.svg" alt="Senha" class="w-4 h-4" />
          <span>Alterar Senha</span>
          <span class="text-sm leading-none">&rsaquo;</span>
        </button>

        <!-- Campo Expansível de Nova Senha (para simular a troca na própria tela) -->
        @if (exibirCampoNovaSenha) {
          <div class="flex flex-col gap-1.5 pt-1">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
              Nova Senha
            </label>
            <input 
              type="password"
              formControlName="novaSenha"
              placeholder="Digite a nova senha (mín. 8 caracteres)"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-[#153969] outline-none focus:border-[#153969] transition" />
          </div>
        }

      </form>
    </div>

    <!-- Alerta de Sucesso ao Atualizar -->
    @if (mensagemFeedback) {
      <div class="w-full mb-4 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold rounded-xl p-3 text-center">
        {{ mensagemFeedback }}
      </div>
    }

    <!-- Botão Primário: Atualizar Dados -->
    <button
      type="button"
      (click)="atualizarDados()"
      [disabled]="salvandoDados"
      class="w-full bg-[#153969] hover:bg-[#0f2a4d] disabled:opacity-60 text-white font-bold text-[15px] rounded-2xl py-4 flex items-center justify-center gap-2.5 transition shadow-sm mb-3.5 cursor-pointer">
      <img src="assets/icons/verify_white_icon.svg" alt="Atualizar" class="w-5 h-5" />
      <span>{{ salvandoDados ? 'Atualizando...' : 'Atualizar Dados' }}</span>
    </button>

    <!-- Botão Secundário Destrutivo: Excluir Conta -->
    <button
      type="button"
      (click)="excluirConta()"
      class="w-full bg-white hover:bg-red-50/50 text-red-600 font-bold text-[15px] rounded-2xl py-3.5 border border-red-500 flex items-center justify-center gap-2.5 transition mb-2.5 cursor-pointer">
      <img src="assets/icons/trash_icon.svg" alt="Excluir" class="w-4 h-4" />
      <span>Excluir Conta</span>
    </button>

    <!-- Aviso de Ação Irreversível -->
    <span class="text-[11px] text-red-500/80 text-center">
      Esta ação não pode ser desfeita
    </span>

  </div>
</app-container-content>
